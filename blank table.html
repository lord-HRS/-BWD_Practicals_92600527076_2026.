<!DOCTYPE html>
<html>
<head>
  <title>Simple Table Design</title>
</head>
<body>

  <table border="5" width="500" height="300">
    <!-- Top Row -->
    <tr>
      <td>1</td>
      <td>2</td>
      <td colspan="1"> </td>
    </tr>
    <!-- Bottom Row -->
    <tr>
      <td rowspan="2"></td>
      <td width="50" height="50" >
    </tr>
    <tr>
        <td>3</td>
        <td>4</td>
        <td colspan="3"> </td>
      </tr>
      <tr>
        <td>5</td>
        <td>6</td>
        <td colspan="1"> </td>
      </tr>
  </table>

</body>
</html>
