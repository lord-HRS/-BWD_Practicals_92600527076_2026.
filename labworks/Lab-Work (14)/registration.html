<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration & Login </title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    
    body { background-color: #f8f9fa; }
    
    .bg-login-header { background-color: #343a40; } 
    .btn-login { background-color: #343a40; color: #fff; }
    .btn-login:hover { background-color: #212529; color: #fff; }
    
    .bg-reg-header { background-color: #4a5568; }
    .btn-reg { background-color: #4a5568; color: #fff; }
    .btn-reg:hover { background-color: #2d3748; color: #fff; }
  </style>
</head>
<body class="py-5">

  <div class="container">
    <div class="row g-4">

      <!-- Login Card -->
      <div class="col-md-6">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-login-header text-white py-3">
            <h4 class="card-title mb-0">Login</h4>
          </div>
          <div class="card-body p-4">
            <form>
              <div class="mb-3">
                <label for="loginEmail" class="form-label fw-bold">Email address</label>
                <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com" required>
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label fw-bold">Password</label>
                <input type="password" class="form-control" id="loginPassword" placeholder="Enter password" required>
              </div>
              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label" for="rememberMe">
                  Remember me
                </label>
              </div>
              <button type="submit" class="btn btn-login w-100">Sign In</button>
            </form>
          </div>
        </div>
      </div>

    
      <div class="col-md-6">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-reg-header text-white py-3">
            <h4 class="card-title mb-0">Register</h4>
          </div>
          <div class="card-body p-4">
            <form>
              <div class="mb-3">
                <label for="regName" class="form-label fw-bold">Full Name</label>
                <input type="text" class="form-control" id="regName" placeholder="John Doe" required>
              </div>
              <div class="mb-3">
                <label for="regEmail" class="form-label fw-bold">Email address</label>
                <input type="email" class="form-control" id="regEmail" placeholder="name@example.com" required>
              </div>
              <div class="mb-3">
                <label for="regPassword" class="form-label fw-bold">Password</label>
                <input type="password" class="form-control" id="regPassword" placeholder="Create password" required>
              </div>
              <div class="mb-3">
                <label for="confirmPassword" class="form-label fw-bold">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm password" required>
              </div>
              <button type="submit" class="btn btn-reg w-100">Create Account</button>
            </form>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
