<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Feed Clone</title>
    <style>
       
        body {
            background-color: rgb(242, 232,207); 
            color: black;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px 0;
            display: flex;
            justify-content: center;
        }

        
        .feed-container {
            width: 100%;
            max-width: 555px; 
        }

        .post-card {
            background-color: rgb(167, 201, 87);
            border-radius: 8px;
            border: 1px solid rgb(188, 71, 73); 
            margin-bottom: 10px;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.05);
        }

        .post-header {
            display: flex;
            align-items: flex-start;
            padding: 12px 16px 0 16px;
        }

        .profile-pic {
            width: 48px;
            height: 48px;
            border-radius: 50%; 
            object-fit: cover;
            margin-right: 12px;
        }

        .user-info .username {
            font-weight: 600;
            font-size: 14px;
            color: rgba(0, 0, 0, 0.9);
            margin: 0;
        }

        .user-info .headline {
            font-size: 12px;
            color: rgba(0, 0, 0, 0.6);
            margin: 2px 0;
        }

        .user-info .post-time {
            font-size: 12px;
            color: rgba(0, 0, 0, 0.6);
            margin: 0;
        }

        
        .post-text {
            padding: 12px 16px;
            font-size: 14px;
            color: rgba(0, 0, 0, 0.9);
            line-height: 1.5;
            margin: 0;
        }


        .post-image img {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            display: block;
        }

        
        .post-actions {
            display: flex;
            justify-content: space-between;
            padding: 4px 8px;
            border-top: 1px solid #e0dfdc;
            margin: 0 8px;
        }

        .action-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 10px 12px;
            border-radius: 4px;
            color: rgba(0, 0, 0, 0.6);
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn:hover {
            background-color: rgba(0, 0, 0, 0.08); 
        }
    </style>
</head>
<body>

    <div class="feed-container">
        
        <!-- Post 1 -->
        <div class="post-card">
            <div class="post-header">
                <img src="images/pfp.png" class="profile-pic" alt="Profile">
                <div class="user-info">
                    <p class="username">Ronaldo</p>
                    <p class="headline">Payer & Tech YouTuber from FIFA</p>
                    <p class="post-time">2h • Edited • 🌐</p>
                </div>
            </div>
            <p class="post-text">Excited to share our newest workflow test building scalable layouts using HTML and CSS. Consistency is everything when building for the web!</p>
            <div class="post-image">
                <img src="images/2.jpg" alt="Post Image">
            </div>
            <div class="post-actions">
                <button class="action-btn">👍 Like</button>
                <button class="action-btn">💬 Comment</button>
                <button class="action-btn">🔄 Repost</button>
                <button class="action-btn">📤 Send</button>
            </div>
        </div>

    </div>

</body>
</html>
