<!DOCTYPE html>

<body style="background-color: rgb(255, 255, 255);">
    



<!-- 1st button -->
<button class="S">SUBSCRIBE</button>
<style>
.S{
    background-color:   rgb(219, 7, 7);
    color:  white;
    border:  none;
    height:  30px;
    width:  110px;
    border-radius:  2px;
    cursor:     pointer;
    margin-right:    8px;
  
}
</style>

<style>
    .S:hover{
    background-color:black;
    }
</style>

 <style>.S:active{
background-color: blue;
}
</style>
    
<!-- ========================================================== -->

<!-- 2nd button ⬇ -->

<button class="j">JOIN</button>
<style>
.j{
    background-color: white;
    color: rgb(3, 144, 210);
    border-color: rgb(3, 144, 210);
    border-style: solid;
    border-width: 1px;
    border-radius:  2px;
    height: 30px;
    width:  55px;
    cursor: pointer;
    margin-left:50px;
    font-weight:bolder;
}
</style>

 <style>
.j:hover{
background-color: blue;
}
 </style>

<style> .j:active{
    background-color: black;    
}
</style>
